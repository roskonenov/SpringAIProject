server.port=${PORT:8080}

spring.application.name=spring-ai

spring.ai.openai.api-key=${TOGETHER_AI_API_KEY}
spring.ai.openai.base-url=https://api.together.ai
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

front-end.url=${FRONTEND_URL:http://localhost:5173}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB