name: Deploy Backend to GCP Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'spring-ai/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: spring-ai-service-183314
  REGION: europe-west3
  GAR_LOCATION: europe-west3
  REPOSITORY: spring-ai-repo
  SERVICE_NAME: spring-ai-backend

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to Google Cloud
        env:
          KEY_DATA: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 -c "
          import os, sys, json, base64

          raw = os.environ.get('KEY_DATA', '').strip()
          if not raw:
              print('ERROR: Secret GCP_SA_KEY is empty in GitHub Repository Secrets!', file=sys.stderr)
              sys.exit(1)

          try:
              decoded = base64.b64decode(raw).decode('utf-8')
              data = json.loads(decoded, strict=False)
          except Exception:
              data = json.loads(raw, strict=False)

          with open('/tmp/gcp_sa_key.json', 'w') as f:
              json.dump(data, f)
          "
          gcloud auth activate-service-account --key-file=/tmp/gcp_sa_key.json
          gcloud config set project ${{ env.PROJECT_ID }}
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_sa_key.json" >> "$GITHUB_ENV"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest"
          
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" ./spring-ai
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          SERVICE_URL=$(gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_URI" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --set-env-vars "TOGETHER_AI_API_KEY=${{ secrets.TOGETHER_AI_API_KEY }},FRONTEND_URL=${{ secrets.FRONTEND_URL || 'http://localhost:5173' }}" \
            --format 'value(status.url)')
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Show Service URL
        run: |
          echo "Backend successfully deployed to: ${{ steps.deploy.outputs.url }}"
